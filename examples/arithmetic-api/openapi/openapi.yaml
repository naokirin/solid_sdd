openapi: 3.0.3
info:
  title: Arithmetic API
  version: 0.2.0
  description: >-
    Evaluation sample for solid_sdd — five arithmetic operations over HTTP,
    plus calculator memory (MC/MR/M+/M-).
servers:
  - url: http://localhost:3000
paths:
  /calculate:
    post:
      operationId: calculate
      summary: Evaluate a binary arithmetic operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateRequest'
      responses:
        '200':
          description: Calculation succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateResponse'
        '400':
          description: Invalid request or precondition violation (e.g. division or modulo by zero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /memory/clear:
    post:
      operationId: memoryClear
      summary: Clear calculator memory (MC)
      responses:
        '200':
          description: Memory cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '400':
          description: Invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /memory/recall:
    post:
      operationId: memoryRecall
      summary: Recall calculator memory (MR)
      responses:
        '200':
          description: Current memory value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '400':
          description: Invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /memory/add:
    post:
      operationId: memoryAdd
      summary: Add value to calculator memory (M+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryValueRequest'
      responses:
        '200':
          description: Memory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '400':
          description: Invalid JSON or missing value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /memory/subtract:
    post:
      operationId: memorySubtract
      summary: Subtract value from calculator memory (M-)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryValueRequest'
      responses:
        '200':
          description: Memory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '400':
          description: Invalid JSON or missing value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Operation:
      type: string
      enum: [add, sub, mul, div, mod, pow, avg]
    CalculateRequest:
      type: object
      additionalProperties: false
      required: [op, a, b]
      properties:
        op:
          $ref: '#/components/schemas/Operation'
        a:
          type: number
        b:
          type: number
    CalculateResponse:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result:
          type: number
    MemoryValueRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: number
    MemoryResponse:
      type: object
      additionalProperties: false
      required: [memory]
      properties:
        memory:
          type: number
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
