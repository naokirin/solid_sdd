openapi: 3.0.3
info:
  title: Inventory Reservation API
  version: 0.1.0
  description: >-
    Evaluation sample for solid_sdd — soft-hold inventory reservation with
    opaque-principal authZ. W1 documents authorized reserve; W2 elevates
    insufficient-stock reserve failure as named InsufficientStockError with
    no hold and unchanged stock; W3 elevates unauthorized reserve and
    unauthorized release as named UnauthorizedError with no hold created and
    available stock plus existing holds unchanged; W4 elevates authorized
    release so held quantity is restored to available stock as a first-class
    checkable success; W5 elevates service-side TTL expiry so a hold past
    its TTL restores held quantity to available stock (no principal / AuthZ).
    Additive get-by-id lookup (authorized opaque principal) returns an existing
    visible soft-hold's details without mutating stock or holds; missing or
    not-visible lookup fails as named PreconditionError and unauthorized
    lookup as named UnauthorizedError, both with stock and holds unchanged.
    Concurrent last-unit safety elevates that concurrent race losers on reserve
    use the same named InsufficientStockError channel as sequential
    insufficient stock (additive; prior success and error surfaces remain).
    Additive collection list (GET /reservations) returns a full dump of
    currently visible soft-holds as a JSON array of LookupResponse items
    (including empty), ordered by expiresAt ascending (earlier first; equal
    expiresAt order unspecified but stable); unauthorized list fails as named
    UnauthorizedError with stock and holds unchanged.
servers:
  - url: http://localhost:3000
paths:
  /reservations:
    get:
      operationId: listReservations
      summary: List currently visible soft-holds (authorized opaque principal)
      description: >-
        Returns one full dump of all currently visible soft-holds in the same
        visibility universe as get-by-id when the caller is an authorized
        opaque principal. No paging and no sku, status, or time filter
        dimensions; no sort query parameters. Success body is a bare JSON
        array of LookupResponse objects (holdId, sku, quantity, expiresAt,
        availableStock) — chosen over an { items } envelope because this
        document has no prior collection wrapper pattern and items are
        exactly LookupResponse. The array is ordered by expiresAt ascending
        (earlier expiry first); when two items share the same expiresAt,
        their relative order is unspecified but stable. Empty array when
        none are visible. Read-only: stock and holds are unchanged. When the
        caller is unauthorized, the operation fails with named domain error
        UnauthorizedError and leaves available stock and existing holds
        unchanged (POL-OPAQUE-PRINCIPAL-AUTHZ).
      parameters:
        - $ref: '#/components/parameters/OpaquePrincipal'
      responses:
        '200':
          description: >-
            Authorized list success. Clients and tests MUST observe a JSON
            array (possibly empty) whose elements are LookupResponse-
            equivalent (holdId, sku, quantity, expiresAt, availableStock)
            covering all currently visible soft-holds, ordered by expiresAt
            ascending (earlier first). Equal expiresAt may appear in any
            stable order. The operation remains non-mutating: clients and
            tests MUST treat it as leaving available stock and existing holds
            unchanged.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupResponse'
              examples:
                nonempty:
                  summary: Visible soft-holds ordered by expiresAt ascending
                  value:
                    - holdId: hold-earlier
                      sku: SKU-1
                      quantity: 2
                      expiresAt: '2026-08-04T14:00:00.000Z'
                      availableStock: 5
                    - holdId: hold-later
                      sku: SKU-2
                      quantity: 1
                      expiresAt: '2026-08-04T15:00:00.000Z'
                      availableStock: 5
                empty:
                  summary: No visible soft-holds
                  value: []
        '403':
          description: >-
            Named domain failure UnauthorizedError when the caller is not
            authorized to list: available stock and existing holds are
            unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UnauthorizedError:
                  summary: Caller not authorized to list
                  description: >-
                    First-class failure channel for unauthorized list.
                    Clients and tests MUST observe errorType UnauthorizedError,
                    and MUST treat the failure as leaving available stock and
                    existing holds unchanged.
                  value:
                    error: Principal is not authorized to list
                    errorType: UnauthorizedError
        '400':
          description: >-
            Invalid request / PreconditionError (e.g. missing opaque
            principal): available stock and existing holds are unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PreconditionError:
                  summary: Invalid list precondition
                  description: >-
                    Invalid request precondition. Stock and holds unchanged.
                  value:
                    error: principal is required
                    errorType: PreconditionError
    post:
      operationId: reserve
      summary: Soft-hold SKU quantity for a TTL (authorized opaque principal)
      description: >-
        Creates a soft-hold when the caller is authorized and available stock
        is at least the requested quantity. Reduces available stock by that
        quantity for the hold TTL. When available stock is below the requested
        quantity (sequential insufficient stock), or when an authorized
        concurrent reserve loses a same-SKU race (including last-unit races),
        the operation fails with the same named domain error
        InsufficientStockError: no soft-hold is created for the loser and
        available stock is unchanged by that failed attempt. When the caller
        is unauthorized, the operation fails with named domain error
        UnauthorizedError: no soft-hold is created and available stock and
        existing holds are unchanged.
      parameters:
        - $ref: '#/components/parameters/OpaquePrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
      responses:
        '200':
          description: Soft-hold created; available stock reduced by quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReserveResponse'
        '400':
          description: >-
            Named domain failure InsufficientStockError when available stock
            is below the requested quantity or when an authorized concurrent
            reserve loses a same-SKU race (shared channel with sequential
            insufficient stock): no hold is created for the failing attempt
            and available stock is unchanged by that attempt. Also used for
            invalid request / PreconditionError (same no-mutation semantics).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InsufficientStockError:
                  summary: Insufficient available stock (sequential or race loser)
                  description: >-
                    First-class shared failure channel for sequential
                    insufficient stock and concurrent race losers. Clients
                    and tests MUST observe errorType InsufficientStockError
                    for both cases, and MUST treat the failure as creating no
                    soft-hold for that attempt with available stock left
                    unchanged by the failed attempt.
                  value:
                    error: Insufficient available stock for requested quantity
                    errorType: InsufficientStockError
                PreconditionError:
                  summary: Invalid request precondition
                  description: >-
                    Invalid request (e.g. non-positive quantity). No hold
                    created; stock unchanged.
                  value:
                    error: quantity must be a positive integer
                    errorType: PreconditionError
        '403':
          description: >-
            Named domain failure UnauthorizedError when the caller is not
            authorized to reserve: no soft-hold is created; available stock
            and existing holds are unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UnauthorizedError:
                  summary: Caller not authorized to reserve
                  description: >-
                    First-class W3 failure channel for reserve. Clients and
                    tests MUST observe errorType UnauthorizedError, and MUST
                    treat the failure as creating no soft-hold with available
                    stock and existing holds left unchanged.
                  value:
                    error: Principal is not authorized to reserve
                    errorType: UnauthorizedError
  /reservations/{holdId}:
    get:
      operationId: getReservation
      summary: Look up a soft-hold by id (authorized opaque principal)
      description: >-
        Returns details of an existing visible soft-hold identified by holdId
        when the caller is an authorized opaque principal. Read-only: stock
        and holds are unchanged. When the hold is missing or not visible, the
        operation fails with named domain error PreconditionError and leaves
        available stock and existing holds unchanged. When the caller is
        unauthorized, the operation fails with named domain error
        UnauthorizedError and leaves available stock and existing holds
        unchanged. Missing and not-visible share one PreconditionError channel.
      parameters:
        - $ref: '#/components/parameters/OpaquePrincipal'
        - name: holdId
          in: path
          required: true
          description: Identifier of the soft-hold to look up
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: >-
            Authorized lookup success. Clients and tests MUST observe the
            returned hold details (holdId, sku, quantity, expiresAt) for the
            requested holdId, and MUST observe availableStock as the current
            available stock for the hold's SKU. The operation remains
            non-mutating: clients and tests MUST treat it as leaving available
            stock and existing holds unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
        '403':
          description: >-
            Named domain failure UnauthorizedError when the caller is not
            authorized to look up: available stock and existing holds are
            unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UnauthorizedError:
                  summary: Caller not authorized to look up
                  description: >-
                    First-class failure channel for unauthorized lookup.
                    Clients and tests MUST observe errorType UnauthorizedError,
                    and MUST treat the failure as leaving available stock and
                    existing holds unchanged.
                  value:
                    error: Principal is not authorized to look up
                    errorType: UnauthorizedError
        '400':
          description: >-
            Named domain failure PreconditionError when the soft-hold is
            missing or not visible (shared channel), or for invalid request
            preconditions: available stock and existing holds are unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                HoldMissingOrNotVisible:
                  summary: Soft-hold missing or not visible
                  description: >-
                    First-class failure channel for missing/not-visible lookup.
                    Clients and tests MUST observe errorType PreconditionError,
                    and MUST treat the failure as leaving available stock and
                    existing holds unchanged. Missing and not-visible share
                    this named channel.
                  value:
                    error: holdId does not identify a visible soft-hold
                    errorType: PreconditionError
                PreconditionError:
                  summary: Invalid lookup precondition
                  description: >-
                    Invalid request (e.g. empty holdId). Stock and holds
                    unchanged.
                  value:
                    error: holdId is required
                    errorType: PreconditionError
  /reservations/{holdId}/release:
    post:
      operationId: release
      summary: Release a soft-hold and restore held quantity (authZ required)
      description: >-
        Releases an existing soft-hold identified by holdId when the caller
        is an authorized opaque principal. On authorized success, the held
        quantity is restored to available stock and the hold is removed.
        When the caller is unauthorized, the operation fails with named
        domain error UnauthorizedError: no hold is created by the failed
        attempt, and available stock and existing holds are unchanged.
      parameters:
        - $ref: '#/components/parameters/OpaquePrincipal'
        - name: holdId
          in: path
          required: true
          description: Identifier of the soft-hold to release
          schema:
            type: string
            minLength: 1
      responses:
        '204':
          description: >-
            First-class W4 success channel for authorized release. Clients
            and tests MUST treat HTTP 204 as authorized release that restores
            the held quantity to available stock and removes the hold.
            Observable restore-to-available-stock is checkable against prior
            hold quantity (available stock increases by that quantity; the
            released holdId is no longer an active hold).
        '403':
          description: >-
            Named domain failure UnauthorizedError when the caller is not
            authorized to release: no hold is created by the failed attempt;
            available stock and existing holds are unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UnauthorizedError:
                  summary: Caller not authorized to release
                  description: >-
                    First-class W3 failure channel for release. Clients and
                    tests MUST observe errorType UnauthorizedError, and MUST
                    treat the failure as leaving available stock and existing
                    holds unchanged (no hold created by the failed attempt).
                  value:
                    error: Principal is not authorized to release
                    errorType: UnauthorizedError
        '400':
          description: >-
            Invalid request / PreconditionError (e.g. missing hold). No
            mutation of stock or holds beyond documented preconditions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PreconditionError:
                  summary: Invalid release precondition
                  value:
                    error: holdId is required
                    errorType: PreconditionError
  /reservations/{holdId}/expire:
    post:
      operationId: expire
      summary: Treat a soft-hold past TTL as expired and restore held quantity
      description: >-
        Service-side operation that treats an existing soft-hold as expired
        when its TTL has elapsed (expiresAt is strictly before the service
        clock). No opaque principal or AuthZ header is required. On success,
        the held quantity is restored to available stock and the hold is
        removed. Checkability: clients and tests SHOULD arrange a hold whose
        expiresAt is already in the past (or use an injectable service clock)
        so expiry can be exercised without wall-clock waits. When the hold is
        missing or not yet past TTL, the operation fails with named domain
        error PreconditionError and leaves available stock and existing holds
        unchanged.
      parameters:
        - name: holdId
          in: path
          required: true
          description: Identifier of the soft-hold to expire
          schema:
            type: string
            minLength: 1
      responses:
        '204':
          description: >-
            First-class W5 success channel for TTL expiry. Clients and tests
            MUST treat HTTP 204 as service-side expiry that restores the held
            quantity to available stock and removes the hold. Observable
            restore-to-available-stock is checkable against prior hold
            quantity (available stock increases by that quantity; the expired
            holdId is no longer an active hold). Prefer a hold with expiresAt
            already in the past so the success path is checkable without
            real-time waits.
        '400':
          description: >-
            Named domain failure PreconditionError when the hold is missing
            or its TTL has not yet elapsed (expiresAt is not strictly before
            the service clock): available stock and existing holds are
            unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                HoldMissing:
                  summary: Soft-hold not found
                  description: >-
                    holdId does not identify an active soft-hold. No stock or
                    hold mutation.
                  value:
                    error: holdId does not identify an active soft-hold
                    errorType: PreconditionError
                HoldNotPastTtl:
                  summary: Soft-hold TTL has not elapsed
                  description: >-
                    First-class W5 precondition channel for HoldPastTtl.
                    Clients and tests MUST observe errorType PreconditionError
                    when the hold exists but expiresAt is not strictly before
                    the service clock, and MUST treat the failure as leaving
                    available stock and existing holds unchanged.
                  value:
                    error: hold TTL has not elapsed
                    errorType: PreconditionError
components:
  parameters:
    OpaquePrincipal:
      name: X-Principal-Id
      in: header
      required: true
      description: Opaque principal credential for sample-scale authorize/deny
      schema:
        type: string
        minLength: 1
  schemas:
    ReserveRequest:
      type: object
      additionalProperties: false
      required: [sku, quantity]
      properties:
        sku:
          type: string
          minLength: 1
          description: SKU identifier
        quantity:
          type: integer
          minimum: 1
          description: Quantity to soft-hold
        ttlSeconds:
          type: integer
          minimum: 1
          description: Optional hold TTL in seconds; server default applies when omitted
    ReserveResponse:
      type: object
      additionalProperties: false
      required: [holdId, sku, quantity, expiresAt, availableStock]
      properties:
        holdId:
          type: string
          description: Identifier of the created soft-hold
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry instant for the hold TTL
        availableStock:
          type: integer
          minimum: 0
          description: Available stock after the reserve
    LookupResponse:
      type: object
      additionalProperties: false
      required: [holdId, sku, quantity, expiresAt, availableStock]
      properties:
        holdId:
          type: string
          description: Identifier of the soft-hold
        sku:
          type: string
          description: SKU held by this soft-hold
        quantity:
          type: integer
          minimum: 1
          description: Quantity soft-held
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry instant for the hold TTL
        availableStock:
          type: integer
          minimum: 0
          description: Current available stock for the hold's SKU
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, errorType]
      properties:
        error:
          type: string
          description: Human-readable failure message
        errorType:
          type: string
          description: >-
            Named domain error type distinguishable by clients and tests.
            InsufficientStockError: available stock below requested quantity,
            or authorized concurrent same-SKU race loser (same named channel
            as sequential insufficient stock); response implies no soft-hold
            created for the failing attempt and available stock unchanged by
            that attempt.
            UnauthorizedError: caller not authorized for reserve, release,
            lookup, or list; no hold created by the failed attempt
            (reserve/release); available stock and existing holds unchanged.
            PreconditionError: invalid request precondition (including missing
            or not-visible hold on lookup/release/expire, or expire when TTL
            has not elapsed); no unintended stock or hold mutation.
          enum:
            - InsufficientStockError
            - UnauthorizedError
            - PreconditionError
  responses:
    InsufficientStockError:
      description: >-
        Named domain failure InsufficientStockError when available stock is
        below the requested quantity, or when an authorized concurrent reserve
        loses a same-SKU race (shared channel). No soft-hold is created for
        the failing attempt; available stock is unchanged by that attempt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Insufficient available stock for requested quantity
            errorType: InsufficientStockError
    UnauthorizedError:
      description: >-
        Named domain failure UnauthorizedError when the caller is not
        authorized to reserve, release, look up, or list. No soft-hold is
        created by the failed attempt (reserve/release); available stock and
        existing holds are unchanged.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Principal is not authorized
            errorType: UnauthorizedError
